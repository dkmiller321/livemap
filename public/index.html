<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livemap</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Livemap</div>
      <span class="status" data-testid="connection-status" role="status" aria-live="polite">Reconnecting…</span>
    </header>

    <main class="layout">
      <section class="map-wrap" aria-label="Map">
        <div class="map" data-testid="map"></div>
        <div class="empty" data-testid="empty-state">
          <h1>Waiting for traffic</h1>
          <p>Start your app with these environment variables, or run <code>npx livemap demo</code>.</p>
          <pre class="hookup" data-testid="hookup-lines"></pre>
        </div>
      </section>

      <aside class="feed-wrap" aria-label="Feed">
        <div class="feed" data-testid="feed" role="list"></div>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
